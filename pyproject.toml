[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-q4"
version = "0.1.0"
description = "PS1 Exercise 4: modular Titanic notebook analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
